<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="rgb(0, 74, 134)">
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" type="image/x-icon" href="./images/logo_garita.jpg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>404 — Page Not Found | José Francisco Garita Sánchez</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgb(0, 94, 168), rgb(0, 45, 82));
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: 7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .icon { font-size: 2.2rem; margin-bottom: 18px; opacity: 0.85; }
    h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 6px; }
    p { font-size: 1rem; opacity: 0.85; margin-bottom: 6px; }
    .divider { margin: 22px 0; opacity: 0.4; }
    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 26px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.7);
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.25s ease, transform 0.2s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
    .btn.solid { background: #fff; color: rgb(0, 58, 107); border-color: #fff; }
    .btn.solid:hover { background: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon"><i class="fa-solid fa-satellite-dish"></i></div>
    <div class="code">404</div>
    <h1>This page doesn't exist / Esta página no existe</h1>
    <p>The link might be broken, or the page may have moved.</p>
    <p>El enlace podría estar roto, o la página se movió.</p>
    <div class="buttons">
      <a href="/Garita-CV/" class="btn solid"><i class="fa-solid fa-house"></i> Home (EN)</a>
      <a href="/Garita-CV/es/index.html" class="btn"><i class="fa-solid fa-house"></i> Inicio (ES)</a>
    </div>
  </div>
</body>
</html>
